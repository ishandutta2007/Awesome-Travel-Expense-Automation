<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1f1d36" />
    </linearGradient>

    <!-- Accent Gradient 1 -->
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Accent Gradient 2 -->
    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .pulse {
        animation: pulse-animation 4s ease-in-out infinite alternate;
      }
      @keyframes pulse-animation {
        0% { opacity: 0.3; transform: scale(0.98); }
        100% { opacity: 0.8; transform: scale(1.02); }
      }
      .flight-path {
        stroke-dasharray: 8, 8;
        animation: dash 30s linear infinite;
      }
      @keyframes dash {
        to {
          stroke-dashoffset: -1000;
        }
      }
      .float {
        animation: floating 6s ease-in-out infinite alternate;
      }
      @keyframes floating {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-10px); }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)" />

  <!-- Subtle Grid Pattern -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Glowing background orbs (Dynamic Pulsing) -->
  <circle class="pulse" cx="150" cy="100" r="180" fill="#06b6d4" opacity="0.15" filter="url(#glow)" />
  <circle class="pulse" cx="1050" cy="260" r="200" fill="#8b5cf6" opacity="0.15" filter="url(#glow)" style="animation-delay: -2s;" />

  <!-- Flight Path Curve (Dynamic Moving Dash) -->
  <path class="flight-path" d="M 50 300 Q 350 40 700 160 T 1150 80" fill="none" stroke="url(#accent-cyan)" stroke-width="2.5" opacity="0.5" />

  <!-- Modern Airplane Icon on path -->
  <g transform="translate(1140, 75) rotate(15)" fill="#38bdf8">
    <path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
  </g>

  <!-- Left Side: Title & Info -->
  <g transform="translate(80, 80)">
    <!-- Tag Badge -->
    <rect x="0" y="0" width="230" height="28" rx="14" fill="rgba(6, 182, 212, 0.15)" stroke="#06b6d4" stroke-width="1" />
    <text x="115" y="18" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">✈️ ENTERPRISE T&amp;E ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="70" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="900" letter-spacing="-0.5">
      Awesome Travel Expense
    </text>
    <text x="0" y="115" fill="url(#accent-cyan)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="900" letter-spacing="-0.5">
      Automation &amp; Spend Stack 💳
    </text>

    <!-- Subtitle -->
    <text x="0" y="155" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">
      Curated SaaS Platforms, Self-Hosted Tools, OCR Engines &amp; Open-Source Infrastructure
    </text>

    <!-- Mini Feature Pills -->
    <g transform="translate(0, 180)">
      <rect x="0" y="0" width="130" height="26" rx="6" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.1)" />
      <text x="65" y="17" fill="#cbd5e1" font-family="sans-serif" font-size="12" text-anchor="middle">🧾 Smart OCR</text>

      <rect x="140" y="0" width="140" height="26" rx="6" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.1)" />
      <text x="210" y="17" fill="#cbd5e1" font-family="sans-serif" font-size="12" text-anchor="middle">💳 Corporate Cards</text>

      <rect x="290" y="0" width="150" height="26" rx="6" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.1)" />
      <text x="365" y="17" fill="#cbd5e1" font-family="sans-serif" font-size="12" text-anchor="middle">⚡ Auto Reimburse</text>

      <rect x="450" y="0" width="140" height="26" rx="6" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.1)" />
      <text x="520" y="17" fill="#cbd5e1" font-family="sans-serif" font-size="12" text-anchor="middle">📊 Spend Analytics</text>
    </g>
  </g>

  <!-- Right Side: Floating Visual Cards (Dynamic Floating) -->
  <g class="float" transform="translate(850, 60)">
    <!-- Main Card Glassmorphism -->
    <rect x="0" y="0" width="280" height="220" rx="16" fill="url(#card-grad)" stroke="rgba(255, 255, 255, 0.18)" stroke-width="1.5" />

    <!-- Card Header -->
    <circle cx="35" cy="35" r="14" fill="#06b6d4" opacity="0.2" />
    <path d="M30 35 L34 39 L41 31" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="60" y="36" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="700">Expense Reconciled</text>
    <text x="60" y="49" fill="#64748b" font-family="sans-serif" font-size="10">Flight &amp; Hotel • Just now</text>
    <text x="245" y="40" fill="#34d399" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="end">$1,420.00</text>

    <!-- Divider -->
    <line x1="20" y1="68" x2="260" y2="68" stroke="rgba(255, 255, 255, 0.1)" />

    <!-- Progress / Workflow steps -->
    <g transform="translate(20, 85)">
      <circle cx="10" cy="10" r="7" fill="#10b981" />
      <text x="30" y="14" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="500">OCR Receipt Extraction</text>
      <text x="230" y="14" fill="#10b981" font-family="sans-serif" font-size="11" text-anchor="end">100%</text>

      <line x1="10" y1="20" x2="10" y2="35" stroke="rgba(255, 255, 255, 0.2)" stroke-width="2" />

      <circle cx="10" cy="45" r="7" fill="#3b82f6" />
      <text x="30" y="49" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="500">Policy &amp; Per-Diem Check</text>
      <text x="230" y="49" fill="#38bdf8" font-family="sans-serif" font-size="11" text-anchor="end">Passed</text>

      <line x1="10" y1="55" x2="10" y2="70" stroke="rgba(255, 255, 255, 0.2)" stroke-width="2" />

      <circle cx="10" cy="80" r="7" fill="#8b5cf6" />
      <text x="30" y="84" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="500">ERP &amp; Card Sync</text>
      <text x="230" y="84" fill="#c084fc" font-family="sans-serif" font-size="11" text-anchor="end">Automated</text>
    </g>

    <!-- Bottom Mini Status -->
    <rect x="20" y="185" width="240" height="22" rx="4" fill="rgba(16, 185, 129, 0.12)" />
    <text x="140" y="200" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">⚡ Instant Reimbursement Approved</text>
  </g>
</svg>
